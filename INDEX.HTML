
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="box-area">
            <div class="margin">
                <span>Margin</span>

                <div class="border">
                    <span>Border</span>

                    <div class="padding">
                        <span>Padding</span>

                        <div class="content">
                            Content
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
